version: 2
project_name: lawmatics-pp-cli
changelog:
  disable: true
builds:
  - id: lawmatics-pp-cli
    main: ./cmd/lawmatics-pp-cli
    binary: lawmatics-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X lawmatics-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: lawmatics-pp-mcp
    main: ./cmd/lawmatics-pp-mcp
    binary: lawmatics-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: lawmatics-pp-cli
    repository:
      owner: gregvanhorn
      name: homebrew-tap
    homepage: "https://github.com/gregvanhorn/lawmatics-pp-cli"
    description: "Every Lawmatics resource the API exposes, plus offline full-text search, custom-field reports, and intake analytics..."
    install: |
      bin.install "lawmatics-pp-cli"
      bin.install "lawmatics-pp-mcp"
